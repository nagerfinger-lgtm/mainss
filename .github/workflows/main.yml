name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
    - name: Configure Core RDP Settings
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Windows NT\Terminal Services' -Name "MinEncryptionLevel" -Value 1

    - name: Create RDP User with Secure Password
      run: |
        $Password = ConvertTo-SecureString "F8!JT7J42'uf9v" -AsPlainText -Force
        New-LocalUser -Name "User" -Password $Password
        Add-LocalGroupMember -Group "Administrators" -Member "User"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "User"

    - name: Establish Tailscale Connection
      uses: tailscale/github-action@v2
      with:
        oauth-client-id: ${{ secrets.TAILSCALE_AUTH_KEY }}
        args: --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=server-rdp

    - name: Maintain Connection
      run: |
        Write-Host "=== Tailscale IP: $(tailscale ip -4) ==="
        Write-Host "=== RDP ACCESS ==="
        Write-Host "Address: $(tailscale ip -4)"
        Write-Host "Username: User"
        Write-Host "Password: F8!JT7J42'uf9v"
        while ($true) {
          Start-Sleep -Seconds 300
        }
        
