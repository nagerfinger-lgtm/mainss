name: Tailscale Linux RDP

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tailscale Manually
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=$TAILSCALE_AUTH_KEY --accept-dns=false
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Install XFCE Desktop & XRDP
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-goodies xrdp
          sudo systemctl enable xrdp
          echo "xfce4-session" > ~/.xsession
          sudo sed -i 's/port=3389/port=3389/g' /etc/xrdp/xrdp.ini
          sudo systemctl restart xrdp
          
      - name: Set Password for Runner
        run: |
          echo "runner:password123" | sudo chpasswd
          
      - name: Keep Alive
        run: |
          echo "XRDP is ready! Keeping alive..."
          sleep infinity
          
